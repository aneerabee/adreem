name: Deploy legacy ADREEM to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deploy_legacy:
        description: Confirm deployment of the legacy GitHub Pages runtime
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.deploy_legacy == true }}
    runs-on: ubuntu-latest
    env:
      ADREEM_WEB_DEPLOY_TARGET: github-pages
      ADREEM_WEB_RUNTIME_MODE: ${{ vars.ADREEM_WEB_RUNTIME_MODE }}
      ADREEM_LEGACY_PAGES_DEPLOY: ${{ vars.ADREEM_LEGACY_PAGES_DEPLOY }}
      ADREEM_WEB_PUBLIC_ORIGIN: https://aneerabee.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refuse non-legacy GitHub Pages deployment
        run: node server/ops/verifyProductionWebEnv.js
        env:
          VITE_ADREEM_API_URL: ${{ secrets.VITE_ADREEM_API_URL }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_BASE_PATH: /adreem/
          VITE_DEFAULT_APP: adreem
          VITE_ADREEM_API_URL: ${{ secrets.VITE_ADREEM_API_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
